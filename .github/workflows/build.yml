name: Build Billiards Tool to EXE

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  build:

    runs-on: windows-latest

    steps:

      # =========================
      # تحميل ملفات المشروع
      # =========================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # تثبيت بايثون
      # =========================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # =========================
      # تحديث pip
      # =========================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # =========================
      # تثبيت المكتبات
      # =========================

      - name: Install Dependencies
        run: |
          pip install numpy
          pip install opencv-python
          pip install pygame
          pip install pywin32
          pip install keyboard
          pip install mss
          pip install dxcam
          pip install pyinstaller

      # =========================
      # بناء ملف EXE
      # =========================

      - name: Build EXE
        run: |
          pyinstaller ^
          --onefile ^
          --noconsole ^
          --clean ^
          --collect-all pygame ^
          --collect-all cv2 ^
          --hidden-import=dxcam ^
          --hidden-import=win32gui ^
          --hidden-import=win32con ^
          --hidden-import=win32api ^
          --hidden-import=pygame ^
          --hidden-import=cv2 ^
          ballpool.py

      # =========================
      # رفع الملف النهائي
      # =========================

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Billiards-Overlay
          path: dist/ballpool.exe
